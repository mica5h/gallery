<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gallery — Admin</title>
  <link rel="stylesheet" href="/css/styles.css" />
  <link rel="stylesheet" href="/admin/admin.css" />
</head>
<body>
  <header class="site-header">
    <nav class="nav">
      <a href="/" class="nav__brand">Nicol Rubart — Admin</a>
      <ul class="nav__links">
        <li><a href="/">← Back to site</a></li>
        <li id="logoutWrap" hidden><button id="logoutBtn" class="linkbtn">Log out</button></li>
      </ul>
    </nav>
  </header>

  <main class="admin">
    <!-- Login -->
    <section id="loginView" class="panel" hidden>
      <h1>Admin login</h1>
      <form id="loginForm" class="form">
        <label>Username <input type="text" id="username" autocomplete="username" required /></label>
        <label>Password <input type="password" id="password" autocomplete="current-password" required /></label>
        <button type="submit" class="btn">Log in</button>
        <p class="error" id="loginError" hidden></p>
      </form>
    </section>

    <!-- Admin dashboard -->
    <section id="dashView" hidden>
      <h1>Manage gallery</h1>

      <!-- Gallery info -->
      <div class="panel">
        <h2>Site info</h2>
        <p class="muted" style="margin-top:-0.5rem">Fields marked EN / CZ appear in the matching language on the public site.</p>
        <form id="infoForm" class="form">
          <label>Artist / site name <input type="text" id="infoTitle" /></label>
          <label>Intro line — EN <textarea id="infoIntroEn" rows="2"></textarea></label>
          <label>Intro line — CZ <textarea id="infoIntroCz" rows="2"></textarea></label>
          <label>A few words — EN <textarea id="infoWordsEn" rows="3"></textarea></label>
          <label>A few words — CZ <textarea id="infoWordsCz" rows="3"></textarea></label>
          <label>Google Drive link (shown as a QR code in the menu) <input type="url" id="infoDrive" placeholder="https://drive.google.com/drive/folders/…" /></label>
          <fieldset>
            <legend>Contact</legend>
            <label>Name <input type="text" id="contactName" /></label>
            <label>Email <input type="email" id="contactEmail" /></label>
            <label>Note — EN <textarea id="contactNoteEn" rows="2"></textarea></label>
            <label>Note — CZ <textarea id="contactNoteCz" rows="2"></textarea></label>
          </fieldset>
          <button type="submit" class="btn">Save info</button>
          <span class="saved" id="infoSaved" hidden>Saved ✓</span>
        </form>
      </div>

      <!-- Change password -->
      <div class="panel">
        <h2>Change password</h2>
        <form id="passwordForm" class="form">
          <label>Current password <input type="password" id="currentPassword" autocomplete="current-password" required /></label>
          <label>New password (min 8 chars) <input type="password" id="newPassword" autocomplete="new-password" minlength="8" required /></label>
          <label>Confirm new password <input type="password" id="confirmPassword" autocomplete="new-password" minlength="8" required /></label>
          <button type="submit" class="btn">Update password</button>
          <span class="saved" id="passwordSaved" hidden>Password updated ✓</span>
          <p class="error" id="passwordError" hidden></p>
        </form>
      </div>

      <!-- Upload -->
      <div class="panel">
        <h2>Add a work</h2>
        <form id="uploadForm" class="form">
          <label>Image <input type="file" id="imageFile" accept="image/*" required /></label>
          <label>Title — EN <input type="text" id="itemTitleEn" /></label>
          <label>Title — CZ <input type="text" id="itemTitleCz" /></label>
          <label>Description — EN <textarea id="itemDescEn" rows="2"></textarea></label>
          <label>Description — CZ <textarea id="itemDescCz" rows="2"></textarea></label>
          <button type="submit" class="btn">Upload</button>
          <p class="error" id="uploadError" hidden></p>
        </form>
      </div>

      <!-- Existing items -->
      <div class="panel">
        <h2>Works</h2>
        <div id="itemList" class="itemlist"></div>
      </div>
    </section>
  </main>

  <script src="/admin/admin.js"></script>
</body>
</html>
